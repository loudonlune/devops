
- name: Stop containers
  ansible.builtin.shell:
    executable: /bin/bash 
    cmd: |-
      source administrator.env
      ./deploy-mgmt-hub.sh -c agent-install.cfg -S
  when: upgrade or restart

- name: Upgrade stopped containers
  ansible.builtin.shell:
    executable: /bin/bash 
    cmd: |-
      source administrator.env
      ./deploy-mgmt-hub.sh -c agent-install.cfg -u
  when: upgrade

- name: Start containers
  ansible.builtin.shell: 
    executable: /bin/bash 
    cmd: |-
      source administrator.env
      ./deploy-mgmt-hub.sh -c agent-install.cfg -s
  when: upgrade or restart
